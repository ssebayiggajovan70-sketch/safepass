<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduReport — Daily School Reporting System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pink-50: #fdf2f8;
    --pink-100: #fce7f3;
    --pink-200: #fbcfe8;
    --pink-300: #f9a8d4;
    --pink-400: #f472b6;
    --pink-500: #ec4899;
    --pink-600: #db2777;
    --pink-700: #be185d;
    --pink-800: #9d174d;
    --rose-400: #fb7185;
    --rose-500: #f43f5e;
    --white: #ffffff;
    --gray-50: #f9fafb;
    --gray-100: #f3f4f6;
    --gray-200: #e5e7eb;
    --gray-300: #d1d5db;
    --gray-400: #9ca3af;
    --gray-500: #6b7280;
    --gray-600: #4b5563;
    --gray-700: #374151;
    --gray-800: #1f2937;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    --shadow: 0 4px 6px -1px rgba(236,72,153,0.1), 0 2px 4px -1px rgba(236,72,153,0.06);
    --shadow-lg: 0 10px 15px -3px rgba(236,72,153,0.1), 0 4px 6px -2px rgba(236,72,153,0.05);
    --shadow-xl: 0 20px 25px -5px rgba(236,72,153,0.1), 0 10px 10px -5px rgba(236,72,153,0.04);
    --radius: 16px;
    --radius-sm: 10px;
    --radius-lg: 24px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--pink-50);
    color: var(--gray-700);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── ANIMATIONS ─── */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideIn { from { transform: translateX(-100%); } to { transform: translateX(0); } }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes ripple { 0% { transform: scale(0); opacity: 0.5; } 100% { transform: scale(4); opacity: 0; } }

  .animate-fade { animation: fadeIn 0.4s ease forwards; }
  .animate-slide { animation: slideIn 0.3s cubic-bezier(0.34,1.56,0.64,1) forwards; }

  /* ─── SCROLLBAR ─── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--pink-50); }
  ::-webkit-scrollbar-thumb { background: var(--pink-300); border-radius: 99px; }

  /* ─── LOGIN PAGE ─── */
  .login-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 40%, #fbcfe8 100%);
    position: relative;
    overflow: hidden;
  }

  .login-bg-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.4;
    pointer-events: none;
  }

  .login-card {
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(20px);
    border-radius: 28px;
    padding: 48px 44px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 32px 64px rgba(236,72,153,0.15), 0 0 0 1px rgba(236,72,153,0.08);
    animation: fadeIn 0.5s ease forwards;
    position: relative;
    z-index: 1;
  }

  .login-logo {
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, var(--pink-400), var(--pink-600));
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
    font-size: 28px;
    box-shadow: 0 8px 24px rgba(236,72,153,0.3);
  }

  .login-title {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 700;
    text-align: center;
    color: var(--gray-800);
    margin-bottom: 6px;
  }

  .login-sub {
    text-align: center;
    color: var(--gray-500);
    font-size: 14px;
    margin-bottom: 36px;
  }

  /* ─── FORM ELEMENTS ─── */
  .form-group { margin-bottom: 20px; }

  .form-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--gray-600);
    margin-bottom: 8px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  .form-input, .form-select, .form-textarea {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid var(--pink-200);
    border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    color: var(--gray-700);
    background: white;
    transition: all 0.2s;
    outline: none;
  }

  .form-input:focus, .form-select:focus, .form-textarea:focus {
    border-color: var(--pink-400);
    box-shadow: 0 0 0 3px rgba(236,72,153,0.12);
  }

  .form-textarea { resize: vertical; min-height: 90px; }

  /* ─── BUTTONS ─── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    text-decoration: none;
    position: relative;
    overflow: hidden;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--pink-500), var(--pink-600));
    color: white;
    box-shadow: 0 4px 12px rgba(236,72,153,0.3);
  }

  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(236,72,153,0.35);
  }

  .btn-primary:active { transform: translateY(0); }

  .btn-secondary {
    background: var(--pink-50);
    color: var(--pink-600);
    border: 1.5px solid var(--pink-200);
  }

  .btn-secondary:hover { background: var(--pink-100); }

  .btn-danger { background: #fee2e2; color: #dc2626; border: 1.5px solid #fecaca; }
  .btn-danger:hover { background: #fecaca; }

  .btn-success { background: #d1fae5; color: #059669; border: 1.5px solid #a7f3d0; }
  .btn-success:hover { background: #a7f3d0; }

  .btn-full { width: 100%; justify-content: center; }
  .btn-sm { padding: 8px 16px; font-size: 13px; }
  .btn-icon { padding: 10px; border-radius: 10px; }

  /* ─── LAYOUT ─── */
  .app-layout { display: flex; min-height: 100vh; }

  /* ─── SIDEBAR ─── */
  .sidebar {
    width: 260px;
    background: white;
    border-right: 1px solid var(--pink-100);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0;
    left: 0;
    height: 100vh;
    z-index: 100;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 4px 0 24px rgba(236,72,153,0.06);
  }

  .sidebar.collapsed { transform: translateX(-100%); }

  .sidebar-header {
    padding: 24px 20px 20px;
    border-bottom: 1px solid var(--pink-100);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .sidebar-logo {
    width: 42px;
    height: 42px;
    background: linear-gradient(135deg, var(--pink-400), var(--pink-600));
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(236,72,153,0.25);
  }

  .sidebar-brand {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--gray-800);
    line-height: 1.2;
  }

  .sidebar-brand span { color: var(--pink-500); }

  .sidebar-nav { flex: 1; padding: 16px 12px; overflow-y: auto; }

  .nav-section-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--pink-300);
    padding: 8px 8px 4px;
    margin-top: 8px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    color: var(--gray-600);
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 2px;
    position: relative;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
  }

  .nav-item:hover { background: var(--pink-50); color: var(--pink-600); }

  .nav-item.active {
    background: linear-gradient(135deg, var(--pink-50), var(--pink-100));
    color: var(--pink-600);
    font-weight: 600;
  }

  .nav-item.active::before {
    content: '';
    position: absolute;
    left: 0;
    top: 25%;
    height: 50%;
    width: 3px;
    background: var(--pink-500);
    border-radius: 0 4px 4px 0;
  }

  .nav-icon { font-size: 18px; width: 22px; text-align: center; flex-shrink: 0; }

  .sidebar-footer {
    padding: 16px 12px;
    border-top: 1px solid var(--pink-100);
  }

  .user-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 12px;
    background: var(--pink-50);
    cursor: pointer;
    transition: all 0.2s;
  }

  .user-card:hover { background: var(--pink-100); }

  .user-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--pink-300), var(--pink-500));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: white;
    font-weight: 700;
    flex-shrink: 0;
    overflow: hidden;
  }

  .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

  .user-info { flex: 1; min-width: 0; }

  .user-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--gray-700);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .user-role {
    font-size: 11px;
    color: var(--pink-500);
    font-weight: 500;
  }

  /* ─── MAIN CONTENT ─── */
  .main-content {
    flex: 1;
    margin-left: 260px;
    min-height: 100vh;
    transition: margin 0.3s ease;
  }

  .main-content.full { margin-left: 0; }

  /* ─── TOP BAR ─── */
  .topbar {
    background: white;
    border-bottom: 1px solid var(--pink-100);
    padding: 0 24px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: var(--shadow-sm);
  }

  .topbar-left { display: flex; align-items: center; gap: 16px; }

  .topbar-title {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--gray-800);
  }

  .topbar-right { display: flex; align-items: center; gap: 12px; }

  .menu-btn {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    border: 1.5px solid var(--pink-200);
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
    transition: all 0.2s;
  }

  .menu-btn:hover { background: var(--pink-50); border-color: var(--pink-300); }

  /* ─── PAGE CONTENT ─── */
  .page-content {
    padding: 24px;
    animation: fadeIn 0.35s ease forwards;
  }

  /* ─── CARDS ─── */
  .card {
    background: white;
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
    border: 1px solid rgba(236,72,153,0.06);
    transition: box-shadow 0.2s;
  }

  .card:hover { box-shadow: var(--shadow-lg); }

  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--gray-800);
    margin-bottom: 4px;
  }

  .card-sub { font-size: 13px; color: var(--gray-400); margin-bottom: 20px; }

  /* ─── STAT CARDS ─── */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }

  .stat-card {
    background: white;
    border-radius: var(--radius);
    padding: 22px;
    box-shadow: var(--shadow);
    border: 1px solid rgba(236,72,153,0.06);
    display: flex;
    align-items: center;
    gap: 16px;
    transition: all 0.25s;
    cursor: default;
  }

  .stat-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-xl);
  }

  .stat-icon {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }

  .stat-icon.pink { background: linear-gradient(135deg, #fce7f3, #fbcfe8); }
  .stat-icon.rose { background: linear-gradient(135deg, #fff1f2, #ffe4e6); }
  .stat-icon.purple { background: linear-gradient(135deg, #f3e8ff, #e9d5ff); }
  .stat-icon.blue { background: linear-gradient(135deg, #eff6ff, #dbeafe); }
  .stat-icon.green { background: linear-gradient(135deg, #f0fdf4, #dcfce7); }

  .stat-value {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--gray-800);
    line-height: 1;
  }

  .stat-label { font-size: 13px; color: var(--gray-500); margin-top: 4px; }

  .stat-change {
    font-size: 12px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 99px;
    margin-top: 6px;
    display: inline-block;
  }

  .stat-change.up { background: #d1fae5; color: #059669; }
  .stat-change.down { background: #fee2e2; color: #dc2626; }

  /* ─── DASHBOARD GRIDS ─── */
  .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  .dash-grid-3 { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 20px; }

  /* ─── TABLES ─── */
  .table-wrap { overflow-x: auto; }

  table { width: 100%; border-collapse: collapse; }

  th {
    background: var(--pink-50);
    padding: 12px 16px;
    text-align: left;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--pink-600);
    border-bottom: 1px solid var(--pink-100);
  }

  td {
    padding: 13px 16px;
    font-size: 14px;
    color: var(--gray-600);
    border-bottom: 1px solid var(--gray-100);
    transition: background 0.15s;
  }

  tr:hover td { background: var(--pink-50); }
  tr:last-child td { border-bottom: none; }

  /* ─── BADGES ─── */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 99px;
    font-size: 12px;
    font-weight: 600;
  }

  .badge-pink { background: var(--pink-100); color: var(--pink-700); }
  .badge-green { background: #d1fae5; color: #065f46; }
  .badge-yellow { background: #fef3c7; color: #92400e; }
  .badge-blue { background: #dbeafe; color: #1e40af; }
  .badge-red { background: #fee2e2; color: #991b1b; }
  .badge-purple { background: #ede9fe; color: #5b21b6; }

  /* ─── SECTION HEADER ─── */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--gray-800);
  }

  /* ─── STUDENT / TEACHER CARDS GRID ─── */
  .people-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }

  .person-card {
    background: white;
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    border: 1px solid rgba(236,72,153,0.06);
    text-align: center;
    transition: all 0.25s;
    cursor: pointer;
  }

  .person-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-xl); }

  .person-avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    margin: 0 auto 12px;
    background: linear-gradient(135deg, var(--pink-200), var(--pink-400));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: white;
    font-weight: 700;
    overflow: hidden;
    border: 3px solid var(--pink-100);
  }

  .person-avatar img { width: 100%; height: 100%; object-fit: cover; }

  .person-name {
    font-weight: 600;
    font-size: 15px;
    color: var(--gray-800);
    margin-bottom: 4px;
  }

  .person-sub { font-size: 12px; color: var(--gray-400); }

  .person-actions {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 14px;
  }

  /* ─── MODAL ─── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(6px);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    animation: fadeIn 0.2s ease;
  }

  .modal {
    background: white;
    border-radius: 24px;
    padding: 32px;
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 32px 64px rgba(0,0,0,0.2);
    animation: fadeIn 0.3s ease;
  }

  .modal-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--gray-800);
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--pink-100);
  }

  .modal-actions {
    display: flex;
    gap: 12px;
    justify-content: flex-end;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--pink-100);
  }

  /* ─── REPORT FORM ─── */
  .report-section {
    background: var(--pink-50);
    border-radius: var(--radius-sm);
    padding: 16px;
    margin-bottom: 16px;
    border: 1px solid var(--pink-100);
  }

  .report-section-title {
    font-weight: 700;
    font-size: 14px;
    color: var(--pink-600);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ─── STUDENT REPORT ROW ─── */
  .student-report-row {
    background: white;
    border-radius: var(--radius-sm);
    padding: 16px;
    margin-bottom: 12px;
    border: 1px solid var(--pink-100);
    transition: all 0.2s;
  }

  .student-report-row:hover { box-shadow: var(--shadow); }

  .student-report-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  .student-report-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  /* ─── NOTIFICATION BANNER ─── */
  .notification {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: white;
    border-radius: 14px;
    padding: 16px 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 300;
    animation: fadeIn 0.3s ease;
    border-left: 4px solid var(--pink-500);
    max-width: 320px;
  }

  .notification.success { border-color: #10b981; }
  .notification.error { border-color: #ef4444; }

  /* ─── PHOTO UPLOAD ─── */
  .photo-upload {
    border: 2px dashed var(--pink-300);
    border-radius: var(--radius-sm);
    padding: 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--pink-50);
  }

  .photo-upload:hover {
    border-color: var(--pink-500);
    background: var(--pink-100);
  }

  /* ─── CHART CONTAINER ─── */
  .chart-container { position: relative; height: 220px; }

  /* ─── PROGRESS BAR ─── */
  .progress-bar {
    height: 8px;
    background: var(--pink-100);
    border-radius: 99px;
    overflow: hidden;
    margin-top: 8px;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--pink-400), var(--pink-600));
    border-radius: 99px;
    transition: width 0.8s cubic-bezier(0.34,1.56,0.64,1);
  }

  /* ─── OVERLAY ─── */
  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 90;
  }

  /* ─── TABS ─── */
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--pink-50);
    padding: 4px;
    border-radius: 12px;
    border: 1px solid var(--pink-100);
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .tab {
    padding: 9px 20px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 500;
    color: var(--gray-500);
    cursor: pointer;
    border: none;
    background: none;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.2s;
  }

  .tab.active {
    background: white;
    color: var(--pink-600);
    font-weight: 600;
    box-shadow: var(--shadow-sm);
  }

  .tab:hover:not(.active) { color: var(--pink-400); }

  /* ─── SEARCH ─── */
  .search-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: white;
    border: 1.5px solid var(--pink-200);
    border-radius: 10px;
    padding: 8px 14px;
    transition: all 0.2s;
  }

  .search-box:focus-within { border-color: var(--pink-400); box-shadow: 0 0 0 3px rgba(236,72,153,0.12); }

  .search-input {
    border: none;
    outline: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--gray-700);
    flex: 1;
    min-width: 0;
  }

  /* ─── WEEK SELECTOR ─── */
  .week-pills {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .week-pill {
    padding: 7px 16px;
    border-radius: 99px;
    font-size: 13px;
    font-weight: 600;
    border: 1.5px solid var(--pink-200);
    background: white;
    cursor: pointer;
    color: var(--gray-500);
    transition: all 0.2s;
  }

  .week-pill:hover { border-color: var(--pink-400); color: var(--pink-500); }
  .week-pill.active { background: var(--pink-500); color: white; border-color: var(--pink-500); }

  /* ─── EMPTY STATE ─── */
  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--gray-400);
  }

  .empty-state-icon { font-size: 48px; margin-bottom: 16px; }

  .empty-state-text {
    font-size: 16px;
    font-weight: 500;
    color: var(--gray-500);
    margin-bottom: 8px;
  }

  .empty-state-sub { font-size: 14px; }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .sidebar-overlay { display: block; }
    .main-content { margin-left: 0; }
    .dash-grid, .dash-grid-3 { grid-template-columns: 1fr; }
    .student-report-grid { grid-template-columns: 1fr; }
    .page-content { padding: 16px; }
    .modal { padding: 24px 20px; }
    .stat-grid { grid-template-columns: 1fr 1fr; }
    .people-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  }

  @media (max-width: 480px) {
    .stat-grid { grid-template-columns: 1fr; }
  }

  /* ─── LOADING SPINNER ─── */
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid var(--pink-100);
    border-top-color: var(--pink-500);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto;
  }

  /* ─── DIVIDER ─── */
  .divider { height: 1px; background: var(--pink-100); margin: 20px 0; }

  /* ─── TOOLTIP ─── */
  .tooltip-wrap { position: relative; display: inline-flex; }

  /* ─── DRAFT BADGE ─── */
  .draft-indicator {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: #fef3c7;
    color: #92400e;
    border-radius: 99px;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid #fde68a;
  }

  /* ─── RADIO GROUP ─── */
  .radio-group { display: flex; gap: 12px; flex-wrap: wrap; }

  .radio-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px;
    border-radius: 10px;
    border: 1.5px solid var(--pink-200);
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    color: var(--gray-600);
    background: white;
    transition: all 0.15s;
    user-select: none;
  }

  .radio-option.selected {
    border-color: var(--pink-500);
    background: var(--pink-50);
    color: var(--pink-700);
  }

  .radio-dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid var(--pink-300);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }

  .radio-option.selected .radio-dot {
    border-color: var(--pink-500);
    background: var(--pink-500);
  }

  .radio-option.selected .radio-dot::after {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: white;
  }

  /* ─── SETTINGS ─── */
  .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 640px) { .settings-grid { grid-template-columns: 1fr; } }

  .school-logo-upload {
    width: 100px;
    height: 100px;
    border-radius: 20px;
    background: linear-gradient(135deg, var(--pink-100), var(--pink-200));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    cursor: pointer;
    border: 2px dashed var(--pink-300);
    overflow: hidden;
    transition: all 0.2s;
  }

  .school-logo-upload:hover { border-color: var(--pink-500); }
  .school-logo-upload img { width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ─── SAMPLE DATA ───────────────────────────────────────────────
const INITIAL_SCHOOL = {
  name: "St. Mary's Primary School",
  logo: null,
  term: "Term 1",
  year: "2025",
  week: 8
};

const INITIAL_TEACHERS = [
  { id: 1, name: "Mrs. Sarah Nakato", role: "Class Teacher", class: "P.3", email: "sarah@school.com", photo: null, joined: "2022" },
  { id: 2, name: "Mr. John Okello", role: "Teacher on Duty", class: "P.5", email: "john@school.com", photo: null, joined: "2021" },
  { id: 3, name: "Mrs. Grace Atim", role: "Class Teacher", class: "P.1", email: "grace@school.com", photo: null, joined: "2023" },
  { id: 4, name: "Mr. David Ssempa", role: "Class Teacher", class: "P.6", email: "david@school.com", photo: null, joined: "2020" },
];

const INITIAL_STUDENTS = [
  { id: 1, name: "Alice Namukasa", class: "P.3", photo: null },
  { id: 2, name: "Brian Ssebulime", class: "P.3", photo: null },
  { id: 3, name: "Cathy Akello", class: "P.3", photo: null },
  { id: 4, name: "Daniel Muwonge", class: "P.3", photo: null },
  { id: 5, name: "Eva Nabirye", class: "P.3", photo: null },
  { id: 6, name: "Fred Ochieng", class: "P.1", photo: null },
  { id: 7, name: "Grace Amoding", class: "P.1", photo: null },
  { id: 8, name: "Henry Lule", class: "P.5", photo: null },
  { id: 9, name: "Irene Namanya", class: "P.5", photo: null },
  { id: 10, name: "James Onyango", class: "P.6", photo: null },
];

const INITIAL_DUTY_REPORTS = [
  {
    id: 1, teacher: "Mr. John Okello", date: "2025-01-13", day: "Monday",
    attendance: "Present: 342, Absent: 18, Late: 5",
    general: "School day proceeded smoothly. Morning assembly was held on time.",
    discipline: "Two students reported for fighting in the playground at break time.",
    events: "Mathematics olympiad preparation meeting with P.6 and P.7 teachers.",
    comments: "Need more benches in the lower primary block."
  },
  {
    id: 2, teacher: "Mrs. Sarah Nakato", date: "2025-01-14", day: "Tuesday",
    attendance: "Present: 350, Absent: 10, Late: 2",
    general: "Very calm and productive day. All teachers reported on time.",
    discipline: "No major discipline issues reported.",
    events: "Parent-teacher meeting scheduled reminder sent home.",
    comments: "School generator needs servicing."
  }
];

const INITIAL_CLASS_REPORTS = [];

const CLASSES = ["P.1", "P.2", "P.3", "P.4", "P.5", "P.6", "P.7"];
const TERMS = ["Term 1", "Term 2", "Term 3"];
const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
const BEHAVIORS = ["Excellent", "Good", "Fair", "Needs Improvement", "Poor"];
const HOMEWORK = ["Completed", "Incomplete", "Not Attempted", "N/A"];

// ─── USERS ─────────────────────────────────────────────────────
const USERS = [
  { id: 1, name: "Admin User", email: "admin@school.com", password: "admin123", role: "Admin", class: null },
  { id: 2, name: "Mrs. Sarah Nakato", email: "sarah@school.com", password: "teacher123", role: "Class Teacher", class: "P.3" },
  { id: 3, name: "Mr. John Okello", email: "john@school.com", password: "teacher123", role: "Teacher on Duty", class: null },
];

// ─── HELPERS ────────────────────────────────────────────────────
const initials = (name) => name.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();

const today = () => {
  const d = new Date();
  return d.toISOString().split('T')[0];
};

const dayName = () => {
  return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date().getDay()];
};

const colorFor = (name) => {
  const colors = ['#ec4899','#f43f5e','#a855f7','#3b82f6','#10b981','#f59e0b','#6366f1'];
  let hash = 0;
  for (let c of name) hash = c.charCodeAt(0) + ((hash << 5) - hash);
  return colors[Math.abs(hash) % colors.length];
};

// ─── COMPONENTS ─────────────────────────────────────────────────

// Avatar
const Avatar = ({ name, photo, size = 40, radius = '50%' }) => {
  const bg = colorFor(name);
  return (
    <div style={{
      width: size, height: size, borderRadius: radius,
      background: photo ? 'transparent' : `linear-gradient(135deg, ${bg}88, ${bg})`,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      color: 'white', fontWeight: 700, fontSize: size * 0.35,
      overflow: 'hidden', flexShrink: 0,
    }}>
      {photo ? <img src={photo} alt={name} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
             : initials(name)}
    </div>
  );
};

// Toast
const Toast = ({ msg, type, onDone }) => {
  useEffect(() => { const t = setTimeout(onDone, 3200); return () => clearTimeout(t); }, []);
  const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
  return (
    <div className={`notification ${type}`}>
      <span style={{ fontSize: 20 }}>{icons[type] || '🔔'}</span>
      <div>
        <div style={{ fontWeight: 600, fontSize: 14, color: '#1f2937' }}>{msg}</div>
      </div>
      <button onClick={onDone} style={{ marginLeft: 'auto', background: 'none', border: 'none', cursor: 'pointer', color: '#9ca3af', fontSize: 18 }}>×</button>
    </div>
  );
};

// Photo Upload
const PhotoUpload = ({ value, onChange, label = "Upload Photo" }) => {
  const ref = useRef();
  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => onChange(ev.target.result);
    reader.readAsDataURL(file);
  };
  return (
    <div>
      <input type="file" accept="image/*" ref={ref} style={{ display: 'none' }} onChange={handleFile} />
      {value ? (
        <div style={{ textAlign: 'center' }}>
          <img src={value} alt="preview" style={{ width: 90, height: 90, borderRadius: '50%', objectFit: 'cover', border: '3px solid var(--pink-200)', marginBottom: 10 }} />
          <div style={{ display: 'flex', gap: 8, justifyContent: 'center' }}>
            <button className="btn btn-secondary btn-sm" onClick={() => ref.current.click()}>Change</button>
            <button className="btn btn-danger btn-sm" onClick={() => onChange(null)}>Remove</button>
          </div>
        </div>
      ) : (
        <div className="photo-upload" onClick={() => ref.current.click()}>
          <div style={{ fontSize: 32, marginBottom: 8 }}>📷</div>
          <div style={{ fontSize: 14, color: 'var(--gray-500)', fontWeight: 500 }}>{label}</div>
          <div style={{ fontSize: 12, color: 'var(--gray-400)', marginTop: 4 }}>Click to browse or capture</div>
        </div>
      )}
    </div>
  );
};

// ─── LOGIN PAGE ──────────────────────────────────────────────────
const LoginPage = ({ onLogin }) => {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  const handleLogin = async (e) => {
    e.preventDefault();
    setError('');
    setLoading(true);
    await new Promise(r => setTimeout(r, 800));
    const user = USERS.find(u => u.email === email && u.password === password);
    if (user) {
      onLogin(user);
    } else {
      setError('Invalid email or password. Try admin@school.com / admin123');
    }
    setLoading(false);
  };

  const quickLogin = (u) => { setEmail(u.email); setPassword(u.password); };

  return (
    <div className="login-page">
      <div className="login-bg-orb" style={{ width: 400, height: 400, background: 'var(--pink-300)', top: -100, right: -100 }} />
      <div className="login-bg-orb" style={{ width: 300, height: 300, background: 'var(--pink-400)', bottom: -80, left: -80 }} />
      <div className="login-card">
        <div className="login-logo">🏫</div>
        <h1 className="login-title">EduReport</h1>
        <p className="login-sub">Daily School Reporting System</p>

        <form onSubmit={handleLogin}>
          <div className="form-group">
            <label className="form-label">Email Address</label>
            <input className="form-input" type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="your@email.com" required />
          </div>
          <div className="form-group">
            <label className="form-label">Password</label>
            <input className="form-input" type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••" required />
          </div>
          {error && (
            <div style={{ background: '#fee2e2', color: '#dc2626', padding: '12px 16px', borderRadius: 10, fontSize: 14, marginBottom: 16, border: '1px solid #fecaca' }}>
              {error}
            </div>
          )}
          <button className="btn btn-primary btn-full" type="submit" disabled={loading}>
            {loading ? <><div className="spinner" style={{ width: 18, height: 18, borderWidth: 2 }} /> Signing in…</> : '🔑 Sign In'}
          </button>
        </form>

        <div className="divider" />
        <div style={{ fontSize: 12, color: 'var(--gray-400)', fontWeight: 600, textAlign: 'center', marginBottom: 10, textTransform: 'uppercase', letterSpacing: '0.05em' }}>Quick Demo Login</div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {USERS.map(u => (
            <button key={u.id} className="btn btn-secondary btn-sm" style={{ justifyContent: 'flex-start', gap: 10 }} onClick={() => quickLogin(u)}>
              <Avatar name={u.name} size={24} />
              <div style={{ textAlign: 'left' }}>
                <div style={{ fontWeight: 600, fontSize: 13 }}>{u.name}</div>
                <div style={{ fontSize: 11, color: 'var(--gray-400)', fontWeight: 400 }}>{u.role}</div>
              </div>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
};

// ─── DASHBOARD ──────────────────────────────────────────────────
const Dashboard = ({ user, teachers, students, dutyReports, classReports, school }) => {
  const chartRef = useRef(null);
  const pieRef = useRef(null);
  const chartInstance = useRef(null);
  const pieInstance = useRef(null);

  useEffect(() => {
    if (chartRef.current) {
      if (chartInstance.current) chartInstance.current.destroy();
      chartInstance.current = new Chart(chartRef.current, {
        type: 'line',
        data: {
          labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'],
          datasets: [{
            label: 'Present',
            data: [342, 350, 338, 355, 347],
            borderColor: '#ec4899',
            backgroundColor: 'rgba(236,72,153,0.08)',
            borderWidth: 2.5,
            pointBackgroundColor: '#ec4899',
            pointRadius: 4,
            fill: true,
            tension: 0.4
          }, {
            label: 'Absent',
            data: [18, 10, 22, 5, 13],
            borderColor: '#fb7185',
            backgroundColor: 'rgba(251,113,133,0.06)',
            borderWidth: 2,
            pointBackgroundColor: '#fb7185',
            pointRadius: 4,
            fill: true,
            tension: 0.4
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: 'top', labels: { font: { family: 'DM Sans' }, color: '#6b7280' } } },
          scales: {
            x: { grid: { color: '#fce7f3' }, ticks: { color: '#9ca3af', font: { family: 'DM Sans' } } },
            y: { grid: { color: '#fce7f3' }, ticks: { color: '#9ca3af', font: { family: 'DM Sans' } } }
          }
        }
      });
    }
    if (pieRef.current) {
      if (pieInstance.current) pieInstance.current.destroy();
      pieInstance.current = new Chart(pieRef.current, {
        type: 'doughnut',
        data: {
          labels: ['Reports Submitted', 'Pending'],
          datasets: [{ data: [dutyReports.length, Math.max(0, 5 - dutyReports.length)], backgroundColor: ['#ec4899', '#fce7f3'], borderWidth: 0, hoverOffset: 6 }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { font: { family: 'DM Sans', size: 12 }, color: '#6b7280' } },
            tooltip: { callbacks: { label: (c) => ` ${c.label}: ${c.raw}` } }
          },
          cutout: '70%'
        }
      });
    }
    return () => { chartInstance.current?.destroy(); pieInstance.current?.destroy(); };
  }, [dutyReports]);

  const todayReports = dutyReports.filter(r => r.date === today()).length;
  const weekReports = classReports.filter(r => r.week == school.week).length;

  return (
    <div className="page-content animate-fade">
      <div style={{ marginBottom: 24 }}>
        <h2 style={{ fontFamily: 'Playfair Display', fontSize: 26, fontWeight: 700, color: 'var(--gray-800)' }}>
          Good {new Date().getHours() < 12 ? 'Morning' : new Date().getHours() < 17 ? 'Afternoon' : 'Evening'}, {user.name.split(' ')[0]}! 👋
        </h2>
        <p style={{ color: 'var(--gray-500)', marginTop: 4, fontSize: 14 }}>
          {new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })} · {school.name} · {school.term} {school.year}
        </p>
      </div>

      <div className="stat-grid">
        {[
          { icon: '👩‍🎓', label: 'Total Students', value: students.length, change: '+3 this week', up: true, color: 'pink' },
          { icon: '👩‍🏫', label: 'Total Teachers', value: teachers.length, change: 'All active', up: true, color: 'purple' },
          { icon: '📋', label: 'Reports Today', value: todayReports, change: todayReports > 0 ? 'Submitted' : 'Pending', up: todayReports > 0, color: 'rose' },
          { icon: '📚', label: 'Class Reports (Week)', value: weekReports, change: `Week ${school.week}`, up: true, color: 'blue' },
          { icon: '🏫', label: 'Active Classes', value: CLASSES.length, change: school.term, up: true, color: 'green' },
        ].map((s, i) => (
          <div key={i} className="stat-card" style={{ animationDelay: `${i * 0.06}s` }}>
            <div className={`stat-icon ${s.color}`}>{s.icon}</div>
            <div>
              <div className="stat-value">{s.value}</div>
              <div className="stat-label">{s.label}</div>
              <span className={`stat-change ${s.up ? 'up' : 'down'}`}>{s.change}</span>
            </div>
          </div>
        ))}
      </div>

      <div className="dash-grid-3">
        <div className="card">
          <div className="card-title">📈 Attendance Trends</div>
          <div className="card-sub">This week · {school.term} Week {school.week}</div>
          <div className="chart-container">
            <canvas ref={chartRef} />
          </div>
        </div>
        <div className="card">
          <div className="card-title">📊 Report Status</div>
          <div className="card-sub">Daily duty reports this week</div>
          <div className="chart-container">
            <canvas ref={pieRef} />
          </div>
        </div>
      </div>

      <div className="card">
        <div className="section-header">
          <div>
            <div className="card-title">📋 Recent Duty Reports</div>
            <div className="card-sub">Latest submissions from teachers on duty</div>
          </div>
        </div>
        <div className="table-wrap">
          {dutyReports.length === 0 ? (
            <div className="empty-state">
              <div className="empty-state-icon">📭</div>
              <div className="empty-state-text">No reports yet</div>
              <div className="empty-state-sub">Reports will appear here after submission</div>
            </div>
          ) : (
            <table>
              <thead>
                <tr>
                  <th>Teacher</th>
                  <th>Date</th>
                  <th>Day</th>
                  <th>Attendance</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                {dutyReports.slice(-5).reverse().map(r => (
                  <tr key={r.id}>
                    <td>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                        <Avatar name={r.teacher} size={32} />
                        <span style={{ fontWeight: 500 }}>{r.teacher}</span>
                      </div>
                    </td>
                    <td>{r.date}</td>
                    <td><span className="badge badge-pink">{r.day}</span></td>
                    <td style={{ fontSize: 13 }}>{r.attendance}</td>
                    <td><span className="badge badge-green">✓ Submitted</span></td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </div>
    </div>
  );
};

// ─── DUTY REPORT ─────────────────────────────────────────────────
const DutyReportPage = ({ user, dutyReports, onSave, toast }) => {
  const [form, setForm] = useState({
    teacher: user.name,
    date: today(),
    day: dayName(),
    attendance: '',
    general: '',
    discipline: '',
    events: '',
    comments: ''
  });
  const [draft, setDraft] = useState(false);
  const [submitted, setSubmitted] = useState(false);

  useEffect(() => {
    // auto-save draft every 30s
    const t = setInterval(() => {
      if (form.general || form.attendance) { setDraft(true); }
    }, 10000);
    return () => clearInterval(t);
  }, [form]);

  const handleSubmit = () => {
    if (!form.attendance || !form.general) { toast('Please fill in required fields', 'error'); return; }
    onSave({ ...form, id: Date.now() });
    setSubmitted(true);
    setDraft(false);
    toast('Report submitted successfully! ✨', 'success');
  };

  const handleSaveDraft = () => { setDraft(true); toast('Draft saved automatically 💾', 'info'); };

  if (submitted) return (
    <div className="page-content animate-fade">
      <div className="card" style={{ textAlign: 'center', padding: 48 }}>
        <div style={{ fontSize: 64, marginBottom: 16 }}>🎉</div>
        <h2 style={{ fontFamily: 'Playfair Display', fontSize: 24, fontWeight: 700, color: 'var(--gray-800)', marginBottom: 8 }}>Report Submitted!</h2>
        <p style={{ color: 'var(--gray-500)', marginBottom: 24 }}>Your daily duty report for {form.day}, {form.date} has been saved.</p>
        <button className="btn btn-primary" onClick={() => setSubmitted(false)}>📝 Submit Another Report</button>
      </div>
    </div>
  );

  return (
    <div className="page-content animate-fade">
      <div className="section-header">
        <div>
          <h2 className="section-title">📋 Teacher on Duty Report</h2>
          <p style={{ color: 'var(--gray-500)', fontSize: 14 }}>Submit your daily school report</p>
        </div>
        <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
          {draft && <span className="draft-indicator">💾 Draft saved</span>}
          <button className="btn btn-secondary" onClick={handleSaveDraft}>Save Draft</button>
          <button className="btn btn-primary" onClick={handleSubmit}>Submit Report ✓</button>
        </div>
      </div>

      <div className="card">
        <div className="report-section">
          <div className="report-section-title">👤 Report Details</div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 16 }}>
            <div className="form-group" style={{ margin: 0 }}>
              <label className="form-label">Teacher Name</label>
              <input className="form-input" value={form.teacher} readOnly style={{ background: 'var(--gray-50)' }} />
            </div>
            <div className="form-group" style={{ margin: 0 }}>
              <label className="form-label">Date</label>
              <input className="form-input" type="date" value={form.date} onChange={e => setForm({ ...form, date: e.target.value })} />
            </div>
            <div className="form-group" style={{ margin: 0 }}>
              <label className="form-label">Day</label>
              <select className="form-select" value={form.day} onChange={e => setForm({ ...form, day: e.target.value })}>
                {DAYS.map(d => <option key={d}>{d}</option>)}
              </select>
            </div>
          </div>
        </div>

        <div className="report-section">
          <div className="report-section-title">📊 Attendance Summary *</div>
          <textarea className="form-textarea" placeholder="e.g. Present: 342, Absent: 18, Late: 5, Total: 365" value={form.attendance} onChange={e => setForm({ ...form, attendance: e.target.value })} />
        </div>

        <div className="report-section">
          <div className="report-section-title">📝 General School Report *</div>
          <textarea className="form-textarea" style={{ minHeight: 110 }} placeholder="Describe the general state of the school today — staff punctuality, cleanliness, smooth running of lessons, etc." value={form.general} onChange={e => setForm({ ...form, general: e.target.value })} />
        </div>

        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
          <div className="report-section">
            <div className="report-section-title">⚠️ Discipline Issues</div>
            <textarea className="form-textarea" placeholder="Report any discipline cases or write 'None'" value={form.discipline} onChange={e => setForm({ ...form, discipline: e.target.value })} />
          </div>
          <div className="report-section">
            <div className="report-section-title">🎉 Events of the Day</div>
            <textarea className="form-textarea" placeholder="Special activities, meetings, visitors, etc." value={form.events} onChange={e => setForm({ ...form, events: e.target.value })} />
          </div>
        </div>

        <div className="report-section">
          <div className="report-section-title">💬 Additional Comments</div>
          <textarea className="form-textarea" placeholder="Any other observations or recommendations…" value={form.comments} onChange={e => setForm({ ...form, comments: e.target.value })} />
        </div>

        <div style={{ display: 'flex', gap: 12, justifyContent: 'flex-end' }}>
          <button className="btn btn-secondary" onClick={handleSaveDraft}>💾 Save Draft</button>
          <button className="btn btn-primary" onClick={handleSubmit}>✓ Submit Report</button>
        </div>
      </div>

      {dutyReports.length > 0 && (
        <div className="card" style={{ marginTop: 20 }}>
          <div className="card-title">📌 Previous Reports</div>
          <div className="card-sub">Your recent submissions</div>
          <div className="table-wrap">
            <table>
              <thead><tr><th>Date</th><th>Day</th><th>Attendance</th><th>Status</th></tr></thead>
              <tbody>
                {dutyReports.filter(r => user.role !== 'Admin' ? r.teacher === user.name : true).slice(-5).reverse().map(r => (
                  <tr key={r.id}>
                    <td>{r.date}</td>
                    <td><span className="badge badge-pink">{r.day}</span></td>
                    <td style={{ fontSize: 13 }}>{r.attendance}</td>
                    <td><span className="badge badge-green">✓ Submitted</span></td>

            </table>
          </div>
        </div>
      )}
    </div>
  );
};

// ─── CLASS REPORT ────────────────────────────────────────────────
const ClassReportPage = ({ user, students, classReports, onSave, toast, school }) => {
  const myClass = user.class || CLASSES[0];
  const [selectedClass, setSelectedClass] = useState(myClass);
  const [selectedDay, setSelectedDay] = useState(DAYS[new Date().getDay() > 0 && new Date().getDay() < 6 ? new Date().getDay() - 1 : 0]);
  const [selectedWeek, setSelectedWeek] = useState(school.week);
  const [selectedTerm, setSelectedTerm] = useState(school.term);
  const [reports, setReports] = useState({});
  const [submitted, setSubmitted] = useState(false);

  const classStudents = students.filter(s => s.class === selectedClass);

  useEffect(() => {
    const init = {};
    classStudents.forEach(s => {
      init[s.id] = { behavior: 'Good', participation: 'Good', homework: 'Completed', comment: '' };
    });
    setReports(init);
  }, [selectedClass, students]);

  const updateReport = (sid, field, val) => setReports(prev => ({ ...prev, [sid]: { ...prev[sid], [field]: val } }));

  const handleSubmit = () => {
    if (classStudents.length === 0) { toast('No students in this class', 'error'); return; }
    const entry = {
      id: Date.now(), teacher: user.name, class: selectedClass,
      day: selectedDay, week: selectedWeek, term: selectedTerm,
      date: today(), reports,
      studentCount: classStudents.length
    };
    onSave(entry);
    setSubmitted(true);
    toast('Class reports submitted for ' + selectedClass + '! 🎉', 'success');
  };

  if (submitted) return (
    <div className="page-content animate-fade">
      <div className="card" style={{ textAlign: 'center', padding: 48 }}>
        <div style={{ fontSize: 64, marginBottom: 16 }}>✅</div>
        <h2 style={{ fontFamily: 'Playfair Display', fontSize: 24, fontWeight: 700, color: 'var(--gray-800)', marginBottom: 8 }}>Class Reports Saved!</h2>
        <p style={{ color: 'var(--gray-500)', marginBottom: 24 }}>Reports for {classStudents.length} students in {selectedClass} have been submitted.</p>
        <button className="btn btn-primary" onClick={() => setSubmitted(false)}>📝 Submit Another</button>
      </div>
    </div>
  );

  return (
    <div className="page-content animate-fade">
      <div className="section-header">
        <div>
          <h2 className="section-title">📚 Class Teacher Report</h2>
          <p style={{ color: 'var(--gray-500)', fontSize: 14 }}>Submit individual student reports for your class</p>
        </div>
        <button className="btn btn-primary" onClick={handleSubmit}>✓ Submit All Reports</button>
      </div>

      <div className="card" style={{ marginBottom: 20 }}>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(160px, 1fr))', gap: 16 }}>
          <div className="form-group" style={{ margin: 0 }}>
            <label className="form-label">Class</label>
            <select className="form-select" value={selectedClass} onChange={e => setSelectedClass(e.target.value)} disabled={user.role === 'Class Teacher'}>
              {CLASSES.map(c => <option key={c}>{c}</option>)}
            </select>
          </div>
          <div className="form-group" style={{ margin: 0 }}>
            <label className="form-label">Term</label>
            <select className="form-select" value={selectedTerm} onChange={e => setSelectedTerm(e.target.value)}>
              {TERMS.map(t => <option key={t}>{t}</option>)}
            </select>
          </div>
          <div className="form-group" style={{ margin: 0 }}>
            <label className="form-label">Week</label>
            <select className="form-select" value={selectedWeek} onChange={e => setSelectedWeek(parseInt(e.target.value))}>
              {Array.from({length: 14}, (_, i) => <option key={i+1} value={i+1}>Week {i+1}</option>)}
            </select>
          </div>
          <div className="form-group" style={{ margin: 0 }}>
            <label className="form-label">Day</label>
            <select className="form-select" value={selectedDay} onChange={e => setSelectedDay(e.target.value)}>
              {DAYS.map(d => <option key={d}>{d}</option>)}
            </select>
          </div>
        </div>
      </div>

      {classStudents.length === 0 ? (
        <div className="card">
          <div className="empty-state">
            <div className="empty-state-icon">👩‍🎓</div>
            <div className="empty-state-text">No students in {selectedClass}</div>
            <div className="empty-state-sub">Add students to this class from the Students page</div>
          </div>
        </div>
      ) : (
        <>
          <div style={{ marginBottom: 12, display: 'flex', alignItems: 'center', gap: 10 }}>
            <span className="badge badge-pink">👩‍🎓 {classStudents.length} Students</span>
            <span className="badge badge-blue">{selectedClass} · {selectedDay} · Week {selectedWeek}</span>
          </div>
          {classStudents.map((student, idx) => (
            <div key={student.id} className="student-report-row" style={{ animationDelay: `${idx * 0.04}s` }}>
              <div className="student-report-header">
                <Avatar name={student.name} photo={student.photo} size={40} />
                <div>
                  <div style={{ fontWeight: 600, fontSize: 15, color: 'var(--gray-800)' }}>{student.name}</div>
                  <div style={{ fontSize: 12, color: 'var(--gray-400)' }}>{student.class}</div>
                </div>
              </div>
              <div className="student-report-grid">
                <div className="form-group" style={{ margin: 0 }}>
                  <label className="form-label">Behavior</label>
                  <select className="form-select" value={reports[student.id]?.behavior || 'Good'} onChange={e => updateReport(student.id, 'behavior', e.target.value)}>
                    {BEHAVIORS.map(b => <option key={b}>{b}</option>)}
                  </select>
                </div>
                <div className="form-group" style={{ margin: 0 }}>
                  <label className="form-label">Participation</label>
                  <select className="form-select" value={reports[student.id]?.participation || 'Good'} onChange={e => updateReport(student.id, 'participation', e.target.value)}>
                    {BEHAVIORS.map(b => <option key={b}>{b}</option>)}
                  </select>
                </div>
                <div className="form-group" style={{ margin: 0 }}>
                  <label className="form-label">Homework</label>
                  <select className="form-select" value={reports[student.id]?.homework || 'Completed'} onChange={e => updateReport(student.id, 'homework', e.target.value)}>
                    {HOMEWORK.map(h => <option key={h}>{h}</option>)}
                  </select>
                </div>
                <div className="form-group" style={{ margin: 0 }}>
                  <label className="form-label">General Comment</label>
                  <input className="form-input" placeholder="e.g. Very attentive today…" value={reports[student.id]?.comment || ''} onChange={e => updateReport(student.id, 'comment', e.target.value)} />
                </div>
              </div>
            </div>
          ))}
          <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: 16 }}>
            <button className="btn btn-primary" onClick={handleSubmit}>✓ Submit All {classStudents.length} Reports</button>
          </div>
        </>
      )}
    </div>
  );
};

// ─── STUDENTS PAGE ────────────────────────────────────────────────
const StudentsPage = ({ students, setStudents, toast }) => {
  const [search, setSearch] = useState('');
  const [filterClass, setFilterClass] = useState('All');
  const [modal, setModal] = useState(null); // null | 'add' | student-obj
  const [form, setForm] = useState({ name: '', class: 'P.3', photo: null });

  const filtered = students.filter(s =>
    (filterClass === 'All' || s.class === filterClass) &&
    s.name.toLowerCase().includes(search.toLowerCase())
  );

  const openAdd = () => { setForm({ name: '', class: 'P.3', photo: null }); setModal('add'); };
  const openEdit = (s) => { setForm({ ...s }); setModal(s); };

  const handleSave = () => {
    if (!form.name.trim()) { toast('Student name is required', 'error'); return; }
    if (modal === 'add') {
      setStudents(prev => [...prev, { ...form, id: Date.now() }]);
      toast('Student added successfully! 👩‍🎓', 'success');
    } else {
      setStudents(prev => prev.map(s => s.id === modal.id ? { ...form, id: s.id } : s));
      toast('Student updated!', 'success');
    }
    setModal(null);
  };

  const handleDelete = (id) => {
    setStudents(prev => prev.filter(s => s.id !== id));
    toast('Student removed', 'info');
  };

  return (
    <div className="page-content animate-fade">
      <div className="section-header">
        <h2 className="section-title">👩‍🎓 Students</h2>
        <button className="btn btn-primary" onClick={openAdd}>+ Add Student</button>
      </div>

      <div style={{ display: 'flex', gap: 12, marginBottom: 20, flexWrap: 'wrap' }}>
        <div className="search-box" style={{ flex: 1, minWidth: 200 }}>
          <span>🔍</span>
          <input className="search-input" placeholder="Search students…" value={search} onChange={e => setSearch(e.target.value)} />
        </div>
        <select className="form-select" style={{ width: 140 }} value={filterClass} onChange={e => setFilterClass(e.target.value)}>
          <option value="All">All Classes</option>
          {CLASSES.map(c => <option key={c}>{c}</option>)}
        </select>
      </div>

      <div style={{ marginBottom: 12 }}>
        <span className="badge badge-pink">{filtered.length} Students</span>
        {filterClass !== 'All' && <span className="badge badge-blue" style={{ marginLeft: 8 }}>{filterClass}</span>}
      </div>

      {filtered.length === 0 ? (
        <div className="card">
          <div className="empty-state">
            <div className="empty-state-icon">🔍</div>
            <div className="empty-state-text">No students found</div>
            <div className="empty-state-sub">Try adjusting your search or filter</div>
          </div>
        </div>
      ) : (
        <div className="people-grid">
          {filtered.map(s => (
            <div key={s.id} className="person-card">
              <div className="person-avatar">
                {s.photo ? <img src={s.photo} alt={s.name} /> : initials(s.name)}
              </div>
              <div className="person-name">{s.name}</div>
              <div className="person-sub" style={{ marginBottom: 6 }}>{s.class}</div>
              <span className="badge badge-blue">{s.class}</span>
              <div className="person-actions">
                <button className="btn btn-secondary btn-sm btn-icon" onClick={() => openEdit(s)} title="Edit">✏️</button>
                <button className="btn btn-danger btn-sm btn-icon" onClick={() => handleDelete(s.id)} title="Delete">🗑️</button>
              </div>
            </div>
          ))}
        </div>
      )}

      {modal && (
        <div className="modal-overlay" onClick={e => e.target.className === 'modal-overlay' && setModal(null)}>
          <div className="modal">
            <div className="modal-title">{modal === 'add' ? '+ Add Student' : '✏️ Edit Student'}</div>
            <PhotoUpload value={form.photo} onChange={p => setForm({ ...form, photo: p })} label="Upload or Capture Student Photo" />
            <div style={{ marginTop: 20 }}>
              <div className="form-group">
                <label className="form-label">Full Name *</label>
                <input className="form-input" placeholder="e.g. Alice Namukasa" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} />
              </div>
              <div className="form-group">
                <label className="form-label">Class</label>
                <select className="form-select" value={form.class} onChange={e => setForm({ ...form, class: e.target.value })}>
                  {CLASSES.map(c => <option key={c}>{c}</option>)}
                </select>
              </div>
            </div>
            <div className="modal-actions">
              <button className="btn btn-secondary" onClick={() => setModal(null)}>Cancel</button>
              <button className="btn btn-primary" onClick={handleSave}>Save Student</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

// ─── ALL REPORTS PAGE ─────────────────────────────────────────────
const ReportsPage = ({ dutyReports, classReports, students, school }) => {

  const [filterDate, setFilterDate] = useState('');

  const filteredDuty = dutyReports.filter(r =>
    (!filterDate || r.date === filterDate)
  );

  const filteredClass = classReports.filter(r =>
    (filterClass === 'All' || r.class === filterClass) &&
    (!filterDate || r.date === filterDate)
  );

  const behaviorColor = (b) => {
    if (b === 'Excellent') return 'badge-green';
    if (b === 'Good') return 'badge-blue';
    if (b === 'Fair') return 'badge-yellow';
    return 'badge-red';
  };

  return (
    <div className="page-content animate-fade">

        <h2 className="section-title">📁 All Reports</h2>

          <input type="date" className="form-input" style={{ width: 170 }} value={filterDate} onChange={e => setFilterDate(e.target.value)} placeholder="Filter by date" />

        <button className={`tab ${tab === 'class' ? 'active' : ''}`} onClick={() => setTab('class')}>📚 Class Reports ({filteredClass.length})</button>
      </div>

      {tab === 'duty' && (
        <div className="card">
          {filteredDuty.length === 0 ? (
            <div className="empty-state">
              <div className="empty-state-icon">📭</div>
              <div className="empty-state-text">No duty reports found</div>
            </div>
