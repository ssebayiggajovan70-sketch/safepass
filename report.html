                <div>
                  <div style={{ fontWeight: 700, color: 'var(--gray-800)', fontSize: 16 }}>{r.teacher}</div>
                  <div style={{ display: 'flex', gap: 8, marginTop: 4 }}>
                    <span className="badge badge-pink">{r.day}</span>
                    <span className="badge badge-blue">{r.date}</span>
                    <span className="badge badge-green">✓ Submitted</span>
                  </div>
                </div>
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 12 }}>
                {[
                  { label: '📊 Attendance', val: r.attendance },
                  { label: '📝 General', val: r.general },
                  { label: '⚠️ Discipline', val: r.discipline },
                  { label: '🎉 Events', val: r.events },
                ].map(({ label, val }) => val && (
                  <div key={label} style={{ background: 'var(--pink-50)', padding: '12px 14px', borderRadius: 10, border: '1px solid var(--pink-100)' }}>
                    <div style={{ fontSize: 12, fontWeight: 700, color: 'var(--pink-600)', marginBottom: 6, textTransform: 'uppercase', letterSpacing: '0.05em' }}>{label}</div>
                    <div style={{ fontSize: 14, color: 'var(--gray-600)' }}>{val}</div>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      )}

      {tab === 'class' && (
        <div>
          {filteredClass.length === 0 ? (
            <div className="card">
              <div className="empty-state">
                <div className="empty-state-icon">📭</div>
                <div className="empty-state-text">No class reports found</div>
              </div>
            </div>
          ) : filteredClass.map(r => (
            <div key={r.id} className="card" style={{ marginBottom: 16 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 16, flexWrap: 'wrap', gap: 10 }}>
                <div>
                  <div style={{ fontWeight: 700, fontSize: 17, color: 'var(--gray-800)', fontFamily: 'Playfair Display' }}>{r.class} Class Report</div>
                  <div style={{ fontSize: 13, color: 'var(--gray-500)', marginTop: 4 }}>By {r.teacher} · {r.date}</div>
                </div>
                <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                  <span className="badge badge-pink">{r.day}</span>
                  <span className="badge badge-blue">Week {r.week}</span>
                  <span className="badge badge-purple">{r.term}</span>
                  <span className="badge badge-green">{r.studentCount} students</span>
                </div>
              </div>
              <div className="table-wrap">
                <table>
                  <thead><tr><th>Student</th><th>Behavior</th><th>Participation</th><th>Homework</th><th>Comment</th></tr></thead>
                  <tbody>
                    {students.filter(s => s.class === r.class).map(s => {
                      const sr = r.reports?.[s.id];
                      if (!sr) return null;
                      return (
                        <tr key={s.id}>
                          <td>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                              <Avatar name={s.name} photo={s.photo} size={28} />
                              <span style={{ fontWeight: 500 }}>{s.name}</span>
                            </div>
                          </td>
                          <td><span className={`badge ${behaviorColor(sr.behavior)}`}>{sr.behavior}</span></td>
                          <td><span className={`badge ${behaviorColor(sr.participation)}`}>{sr.participation}</span></td>
                          <td><span className={`badge ${sr.homework === 'Completed' ? 'badge-green' : sr.homework === 'Incomplete' ? 'badge-yellow' : 'badge-red'}`}>{sr.homework}</span></td>
                          <td style={{ fontSize: 13, color: 'var(--gray-500)' }}>{sr.comment || '—'}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
};

// ─── SETTINGS PAGE ────────────────────────────────────────────────
const SettingsPage = ({ school, setSchool, user, toast }) => {
  const [form, setForm] = useState({ ...school });
  const logoRef = useRef();

  const handleLogoUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => setForm(f => ({ ...f, logo: ev.target.result }));
    reader.readAsDataURL(file);
  };

  const handleSave = () => {
    setSchool(form);
    toast('School settings saved! ✨', 'success');
  };

  return (
    <div className="page-content animate-fade">
      <div className="section-header">
        <h2 className="section-title">⚙️ School Settings</h2>
        {user.role === 'Admin' && <button className="btn btn-primary" onClick={handleSave}>Save Changes</button>}
      </div>

      <div className="card">
        <div className="card-title">🏫 School Information</div>
        <div className="card-sub">Configure your school profile and academic settings</div>

        <div style={{ display: 'flex', gap: 24, alignItems: 'flex-start', marginBottom: 24, flexWrap: 'wrap' }}>
          <div>
            <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--gray-600)', marginBottom: 10, textTransform: 'uppercase', letterSpacing: '0.02em' }}>School Badge / Logo</div>
            <input type="file" ref={logoRef} accept="image/*" style={{ display: 'none' }} onChange={handleLogoUpload} />
            <div className="school-logo-upload" onClick={() => user.role === 'Admin' && logoRef.current.click()}>
              {form.logo ? <img src={form.logo} alt="School logo" /> : '🏫'}
            </div>
            {user.role === 'Admin' && (
              <button className="btn btn-secondary btn-sm" style={{ marginTop: 8, width: '100%' }} onClick={() => logoRef.current.click()}>Upload Logo</button>
            )}
          </div>
          <div style={{ flex: 1, minWidth: 200 }}>
            <div className="settings-grid">
              <div className="form-group">
                <label className="form-label">School Name</label>
                <input className="form-input" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} disabled={user.role !== 'Admin'} />
              </div>
              <div className="form-group">
                <label className="form-label">Academic Year</label>
                <input className="form-input" value={form.year} onChange={e => setForm({ ...form, year: e.target.value })} disabled={user.role !== 'Admin'} />
              </div>
              <div className="form-group">
                <label className="form-label">Current Term</label>
                <select className="form-select" value={form.term} onChange={e => setForm({ ...form, term: e.target.value })} disabled={user.role !== 'Admin'}>
                  {TERMS.map(t => <option key={t}>{t}</option>)}
                </select>
              </div>
              <div className="form-group">
                <label className="form-label">Current Week</label>
                <select className="form-select" value={form.week} onChange={e => setForm({ ...form, week: parseInt(e.target.value) })} disabled={user.role !== 'Admin'}>
                  {Array.from({ length: 14 }, (_, i) => <option key={i+1} value={i+1}>Week {i+1}</option>)}
                </select>
              </div>
            </div>
          </div>
        </div>

        {user.role !== 'Admin' && (
          <div style={{ background: 'var(--pink-50)', border: '1px solid var(--pink-200)', borderRadius: 10, padding: '12px 16px', fontSize: 14, color: 'var(--gray-500)' }}>
            🔒 Only Admin users can modify school settings.
          </div>
        )}
      </div>

      <div className="card" style={{ marginTop: 20 }}>
        <div className="card-title">👤 My Profile</div>
        <div className="card-sub">Your account information</div>
        <div style={{ display: 'flex', gap: 20, alignItems: 'center', flexWrap: 'wrap' }}>
          <Avatar name={user.name} size={72} radius={20} />
          <div>
            <div style={{ fontFamily: 'Playfair Display', fontSize: 20, fontWeight: 700, color: 'var(--gray-800)' }}>{user.name}</div>
            <div style={{ color: 'var(--gray-500)', marginTop: 4 }}>{user.email}</div>
            <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>
              <span className={`badge ${user.role === 'Admin' ? 'badge-purple' : user.role === 'Teacher on Duty' ? 'badge-yellow' : 'badge-blue'}`}>{user.role}</span>
              {user.class && <span className="badge badge-pink">{user.class}</span>}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
};

// ─── PROFILE PAGE ─────────────────────────────────────────────────
const ProfilePage = ({ user, teachers, setTeachers, toast }) => {
  const myTeacher = teachers.find(t => t.name === user.name) || { name: user.name, photo: null, role: user.role, class: user.class || '', email: user.email || '', joined: '2024' };
  const [form, setForm] = useState({ ...myTeacher });

  const handleSave = () => {
    if (myTeacher.id) {
      setTeachers(prev => prev.map(t => t.id === myTeacher.id ? { ...t, ...form } : t));
    }
    toast('Profile updated! ✨', 'success');
  };

  return (
    <div className="page-content animate-fade">
      <div className="section-header">
        <h2 className="section-title">👤 My Profile</h2>
        <button className="btn btn-primary" onClick={handleSave}>Save Changes</button>
      </div>

      <div className="card">
        <div style={{ display: 'flex', gap: 32, flexWrap: 'wrap' }}>
          <div style={{ minWidth: 180 }}>
            <PhotoUpload value={form.photo} onChange={p => setForm({ ...form, photo: p })} label="Upload Profile Photo" />
          </div>
          <div style={{ flex: 1, minWidth: 280 }}>
            <div className="form-group">
              <label className="form-label">Full Name</label>
              <input className="form-input" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} />
            </div>
            <div className="form-group">
              <label className="form-label">Email Address</label>
              <input className="form-input" type="email" value={form.email} onChange={e => setForm({ ...form, email: e.target.value })} />
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
              <div className="form-group">
                <label className="form-label">Role</label>
                <input className="form-input" value={form.role} readOnly style={{ background: 'var(--gray-50)' }} />
              </div>
              <div className="form-group">
                <label className="form-label">Assigned Class</label>
                <select className="form-select" value={form.class || ''} onChange={e => setForm({ ...form, class: e.target.value })}>
                  <option value="">None</option>
                  {CLASSES.map(c => <option key={c}>{c}</option>)}
                </select>
              </div>
            </div>
            <div className="form-group">
              <label className="form-label">New Password (optional)</label>
              <input className="form-input" type="password" placeholder="Leave blank to keep current" />
            </div>
          </div>
        </div>
      </div>
    </div>
  );
};

// ─── MAIN APP ─────────────────────────────────────────────────────
const App = () => {
  const [user, setUser] = useState(null);
  const [page, setPage] = useState('dashboard');
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [teachers, setTeachers] = useState(INITIAL_TEACHERS);
  const [students, setStudents] = useState(INITIAL_STUDENTS);
  const [dutyReports, setDutyReports] = useState(INITIAL_DUTY_REPORTS);
  const [classReports, setClassReports] = useState(INITIAL_CLASS_REPORTS);
  const [school, setSchool] = useState(INITIAL_SCHOOL);
  const [toastMsg, setToastMsg] = useState(null);
  const [isMobile, setIsMobile] = useState(window.innerWidth < 768);

  useEffect(() => {
    const handleResize = () => setIsMobile(window.innerWidth < 768);
    window.addEventListener('resize', handleResize);
    return () => window.removeEventListener('resize', handleResize);
  }, []);

  const toast = (msg, type = 'success') => setToastMsg({ msg, type, id: Date.now() });

  const navItems = [
    { id: 'dashboard', label: 'Dashboard', icon: '🏠', roles: ['Admin', 'Class Teacher', 'Teacher on Duty'] },
    { id: 'duty-report', label: 'Duty Report', icon: '📋', roles: ['Admin', 'Teacher on Duty'] },
    { id: 'class-report', label: 'Class Report', icon: '📚', roles: ['Admin', 'Class Teacher'] },
    { id: 'reports', label: 'All Reports', icon: '📁', roles: ['Admin', 'Class Teacher', 'Teacher on Duty'] },
    { id: 'students', label: 'Students', icon: '👩‍🎓', roles: ['Admin', 'Class Teacher', 'Teacher on Duty'] },
    { id: 'teachers', label: 'Teachers', icon: '👩‍🏫', roles: ['Admin'] },
    { id: 'settings', label: 'Settings', icon: '⚙️', roles: ['Admin', 'Class Teacher', 'Teacher on Duty'] },
    { id: 'profile', label: 'My Profile', icon: '👤', roles: ['Admin', 'Class Teacher', 'Teacher on Duty'] },
  ];

  const visibleNav = navItems.filter(n => !user || n.roles.includes(user.role));

  const pageTitles = { dashboard: 'Dashboard', 'duty-report': 'Duty Report', 'class-report': 'Class Report', reports: 'Reports', students: 'Students', teachers: 'Teachers', settings: 'Settings', profile: 'Profile' };

  const navigate = (p) => {
    setPage(p);
    if (isMobile) setSidebarOpen(false);
  };

  if (!user) return (
    <>
      <LoginPage onLogin={u => { setUser(u); setPage('dashboard'); }} />
      {toastMsg && <Toast key={toastMsg.id} msg={toastMsg.msg} type={toastMsg.type} onDone={() => setToastMsg(null)} />}
    </>
  );

  const renderPage = () => {
    const props = { user, teachers, students, dutyReports, classReports, school, setSchool, toast };
    switch (page) {
      case 'dashboard': return <Dashboard {...props} />;
      case 'duty-report': return <DutyReportPage {...props} onSave={r => setDutyReports(prev => [...prev, r])} />;
      case 'class-report': return <ClassReportPage {...props} onSave={r => setClassReports(prev => [...prev, r])} />;
      case 'reports': return <ReportsPage {...props} />;
      case 'students': return <StudentsPage {...props} setStudents={setStudents} />;
      case 'teachers': return <TeachersPage {...props} setTeachers={setTeachers} />;
      case 'settings': return <SettingsPage {...props} />;
      case 'profile': return <ProfilePage {...props} setTeachers={setTeachers} />;
      default: return <Dashboard {...props} />;
    }
  };

  return (
    <div className="app-layout">
      {/* Sidebar overlay for mobile */}
      {isMobile && sidebarOpen && (
        <div className="sidebar-overlay" style={{ display: 'block' }} onClick={() => setSidebarOpen(false)} />
      )}

      {/* Sidebar */}
      <div className={`sidebar ${isMobile && !sidebarOpen ? 'collapsed' : ''}`}>
        <div className="sidebar-header">
          <div className="sidebar-logo">🏫</div>
          <div>
            <div className="sidebar-brand">Edu<span>Report</span></div>
            <div style={{ fontSize: 11, color: 'var(--gray-400)', fontWeight: 500 }}>{school.term} · {school.year}</div>
          </div>
        </div>

        <nav className="sidebar-nav">
          <div className="nav-section-label">Navigation</div>
          {visibleNav.map(n => (
            <button key={n.id} className={`nav-item ${page === n.id ? 'active' : ''}`} onClick={() => navigate(n.id)}>
              <span className="nav-icon">{n.icon}</span>
              {n.label}
            </button>
          ))}
          <div className="divider" />
          <button className="nav-item" onClick={() => { setUser(null); setPage('dashboard'); }} style={{ color: '#ef4444' }}>
            <span className="nav-icon">🚪</span>
            Sign Out
          </button>
        </nav>

        <div className="sidebar-footer">
          <div className="user-card" onClick={() => navigate('profile')}>
            <Avatar name={user.name} photo={teachers.find(t => t.name === user.name)?.photo} size={36} />
            <div className="user-info">
              <div className="user-name">{user.name}</div>
              <div className="user-role">{user.role}</div>
            </div>
            <span style={{ fontSize: 14, color: 'var(--gray-400)' }}>›</span>
          </div>
        </div>
      </div>

      {/* Main Content */}
      <div className={`main-content ${isMobile ? 'full' : ''}`}>
        <div className="topbar">
          <div className="topbar-left">
            <button className="menu-btn" onClick={() => setSidebarOpen(!sidebarOpen)}>☰</button>
            <span className="topbar-title">{pageTitles[page] || 'EduReport'}</span>
          </div>
          <div className="topbar-right">
            <div style={{ fontSize: 12, color: 'var(--gray-400)', display: isMobile ? 'none' : 'block' }}>
              Week {school.week} · {school.term} · {school.year}
            </div>
            <div style={{
              background: 'linear-gradient(135deg, var(--pink-50), var(--pink-100))',
              border: '1px solid var(--pink-200)',
              borderRadius: 10, padding: '6px 12px',
              fontSize: 13, fontWeight: 600, color: 'var(--pink-600)'
            }}>
              {new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}
            </div>
          </div>
        </div>

        {renderPage()}
      </div>

      {/* Toast */}
      {toastMsg && <Toast key={toastMsg.id} msg={toastMsg.msg} type={toastMsg.type} onDone={() => setToastMsg(null)} />}
    </div>
  );
};

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
